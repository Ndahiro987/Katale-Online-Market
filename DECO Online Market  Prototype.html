<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katale Online Market – Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:#0F8A5F; --g-d:#0B6B49; --g-t:#0F8A5F; --g-soft:#E3F3EC;
  --y:#FFD447; --y-soft:#FFF6D6;
  --b:#1F4E79; --b-soft:#E4ECF4;
  --bg:#F8F9FA; --surface:#FFFFFF; --ink:#14201B; --muted:#5B6B64; --line:#E3E8E5; --sk:#E9EEEB;
  --ok:#28A745; --bad:#DC3545; --bad-soft:#FBE7E9;
  --shadow:0 1px 2px rgba(20,32,27,.05),0 4px 14px rgba(20,32,27,.06);
  --rail:#102A20;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --g-t:#34C48C; --g-soft:#143327; --y-soft:#3A3213; --b-soft:#17283A;
    --bg:#0D1411; --surface:#15201B; --ink:#EAF1ED; --muted:#9DB0A7; --line:#25332D; --sk:#1F2D27;
    --bad-soft:#3A1A1E; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --rail:#0A1712;
  }
}
:root[data-theme="dark"]{
  --g-t:#34C48C; --g-soft:#143327; --y-soft:#3A3213; --b-soft:#17283A;
  --bg:#0D1411; --surface:#15201B; --ink:#EAF1ED; --muted:#9DB0A7; --line:#25332D; --sk:#1F2D27;
  --bad-soft:#3A1A1E; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --rail:#0A1712;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;margin:0;letter-spacing:-.01em;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--y);outline-offset:2px;border-radius:8px}
.ic{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- prototype shell ---------- */
.shell{display:grid;grid-template-columns:288px 1fr;height:100dvh}
.rail{background:var(--rail);color:#DCEBE4;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.rail-h{padding:22px 22px 14px}
.rail-h .logo{display:flex;align-items:center;gap:10px;color:#fff}
.rail-h p{margin:10px 0 0;font-size:13px;color:#9FB8AD}
.rail-list{flex:1;overflow:auto;padding:4px 12px 12px}
.rail-list h5{margin:16px 10px 6px;font-size:12px;font-weight:600;color:#7F9C8F;letter-spacing:.02em}
.rail-list button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border-radius:10px;color:#DCEBE4;font-size:14px}
.rail-list button small{width:22px;color:#7F9C8F;font-variant-numeric:tabular-nums}
.rail-list button:hover{background:rgba(255,255,255,.06)}
.rail-list button[aria-current="true"]{background:var(--g);color:#fff}
.rail-list button[aria-current="true"] small{color:#CFF0E2}
.rail-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid rgba(255,255,255,.1)}
.rail-f button{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;padding:9px;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:600}
.rail-f button:hover{background:rgba(255,255,255,.14)}
.stage{display:flex;align-items:center;justify-content:center;padding:20px;min-width:0;min-height:0;background:
  radial-gradient(circle at 20% 10%,var(--g-soft),transparent 45%),var(--bg)}
.mbar{display:none}

/* ---------- device ---------- */
.device{container-type:inline-size;container-name:dev;width:392px;height:min(850px,100%);background:var(--bg);border:1px solid var(--line);border-radius:38px;box-shadow:0 30px 70px rgba(16,42,32,.22);display:flex;flex-direction:column;overflow:hidden;position:relative}
.device.wide{width:min(1200px,100%)}
.host{flex:1;overflow:auto;overscroll-behavior:contain;scroll-behavior:smooth}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar[hidden]{display:none}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:500;color:var(--muted);border-radius:12px;min-height:50px}
.tabbar button[aria-current="true"]{color:var(--g-t);font-weight:700}
.tabbar button[aria-current="true"] .ic{stroke-width:2.2}

@media (max-width:899px){
  .shell{display:block;height:auto}
  .rail{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:50;transform:translateX(-102%);transition:transform .25s}
  .rail.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
  .scrim[hidden]{display:none}
  .mbar{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:20;height:52px;padding:0 8px;background:var(--rail);color:#fff}
  .mbar b{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbar button{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:#fff}
  .mbar button:hover{background:rgba(255,255,255,.1)}
  .stage{padding:0;display:block;background:var(--bg)}
  .device,.device.wide{width:100%;max-width:640px;margin:0 auto;height:calc(100dvh - 52px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;border-radius:0;box-shadow:none}
  .device.wide{max-width:1200px}
}
@media (prefers-reduced-motion:reduce){.host{scroll-behavior:auto}.rail{transition:none}}

/* ---------- shared UI ---------- */
.pad{padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.sk{display:block;background:var(--sk);border-radius:8px;min-height:10px}
.sk.pill{border-radius:99px}
.top{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 8px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h2{font-size:18px;flex:1}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--ink);position:relative;flex:none}
.iconbtn:hover{background:var(--sk)}
.iconbtn.fill{background:var(--surface);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:700;background:var(--g);color:#fff;text-align:center}
.btn:hover{background:var(--g-d)}
.btn.block{display:flex;width:100%}
.btn.sec{background:var(--y);color:#2A2200}
.btn.sec:hover{background:#F5C928}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--sk)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.danger{background:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--sk);color:var(--muted)}
.tag.ok{background:var(--g-soft);color:var(--g-t)}
.tag.warn{background:var(--y-soft);color:#7A5D00}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--b-soft);color:var(--b)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.warn{color:#FFD447}:root:not([data-theme="light"]) .tag.info{color:#8DBBE6}}
.field{display:block}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.inp,.sel,.txa{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none}
.txa{padding:12px 14px;min-height:96px;resize:vertical}
.inp:focus,.sel:focus,.txa:focus{border-color:var(--g);box-shadow:0 0 0 3px color-mix(in srgb,var(--g) 22%,transparent)}
.sel:disabled{opacity:.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pre{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden}
.pre b{padding:0 12px;font-size:13px;color:var(--muted);align-self:stretch;display:grid;place-items:center;background:var(--sk)}
.pre .inp{border:0;border-radius:0;box-shadow:none}
.sect{padding:6px 16px 0}
.sect-h{display:flex;justify-content:space-between;align-items:baseline;padding:20px 16px 10px}
.sect-h h3{font-size:18px}
.sect-h button{font-size:13px;font-weight:600;color:var(--g-t)}
.es{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 20px;gap:6px}
.es .eb{width:56px;height:56px;border-radius:18px;background:var(--g-soft);color:var(--g-t);display:grid;place-items:center;margin-bottom:6px}
.es h4{font-size:16px}
.es p{margin:0 0 8px;color:var(--muted);font-size:14px;max-width:30ch}
.seg{display:flex;background:var(--sk);border-radius:12px;padding:4px;gap:2px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 12px;scrollbar-width:none}
.tabs button{padding:12px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--g-t);border-color:var(--g)}
.switch{position:relative;width:46px;height:28px;border-radius:99px;background:var(--line);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--g)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.list{padding:0;margin:0;list-style:none}
.list li>button,.list li>div{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left;min-height:56px}
.list li+li{border-top:1px solid var(--line)}
.list .li-i{width:38px;height:38px;border-radius:12px;background:var(--g-soft);color:var(--g-t);display:grid;place-items:center;flex:none}
.stars{display:inline-flex;gap:2px;color:var(--line)}
.stars.on{color:var(--y)}
.stars svg{fill:currentColor;stroke:none}
.vbadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--g-t)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
.crumbs span{padding:3px 8px;border-radius:99px;background:var(--sk)}
.crumbs svg{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- hero / splash ---------- */
.hero{position:relative;background:linear-gradient(160deg,#0F8A5F 0%,#0B6B49 70%);color:#fff;overflow:hidden}
.hero .contour{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.hero>*:not(.contour){position:relative}
.splash{min-height:100%;display:flex;flex-direction:column;padding:28px 24px calc(28px + env(safe-area-inset-bottom,0px))}
.wordmark{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px;letter-spacing:.02em}
.wordmark img{width:38px;height:38px;border-radius:12px;object-fit:cover}
.wordmark i{width:38px;height:38px;border-radius:12px;background:var(--y);color:#2A2200;display:grid;place-items:center}
.splash h1{font-size:42px;line-height:1.02;margin:auto 0 0;font-weight:800;max-width:11ch}
.splash p{margin:14px 0 26px;color:#CFEDE0;max-width:32ch}
.splash .btns{display:grid;gap:10px}

/* ---------- home ---------- */
.home-h{padding:16px 16px 22px;border-radius:0 0 28px 28px}
.locbtn{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600;max-width:100%}
.locbtn small{display:block;font-size:11.5px;font-weight:500;color:#BFE6D6;line-height:1.1}
.sbar{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 16px;border-radius:16px;background:var(--surface);color:var(--muted);text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:16px 12px 0}
.quick button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;text-align:center;line-height:1.2;padding:4px 0}
.quick .qi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--g-soft);color:var(--g-t)}
.quick button:nth-child(2) .qi{background:var(--b-soft);color:var(--b)}
.quick button:nth-child(3) .qi{background:var(--y-soft);color:#7A5D00}
.quick button:nth-child(4) .qi{background:var(--g);color:#fff}
.quick button:nth-child(5) .qi{background:var(--y);color:#2A2200}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
.cat{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;padding:14px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;line-height:1.2;min-height:92px}
.cat .ci{width:34px;height:34px;border-radius:11px;background:var(--g-soft);color:var(--g-t);display:grid;place-items:center}
.cat:hover{border-color:var(--g)}

/* ---------- results ---------- */
.rc{display:flex;gap:12px;padding:12px}
.rc-img{width:92px;height:92px;border-radius:14px;flex:none}
.rc-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px 12px}
.acts button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;background:var(--sk);font-size:11.5px;font-weight:600}
.acts button:hover{background:var(--g-soft);color:var(--g-t)}
.mapbox{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#E6F1EA}
.mapbox svg.map{display:block;width:100%;height:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mapbox{background:#14241D}}

/* ---------- nearby ---------- */
.nearby{display:flex;flex-direction:column;height:100%}
.nearby .mapbox{flex:1;min-height:300px;border-radius:0;border:0}
.nearby .mapbox svg.map{position:absolute;inset:0;width:100%;height:100%}
.sheet{background:var(--surface);border-radius:22px 22px 0 0;margin-top:-22px;position:relative;padding:10px 0 14px;box-shadow:0 -8px 24px rgba(0,0,0,.1)}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.mfloat{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;z-index:2}
.mfloat .sbar{box-shadow:var(--shadow);min-height:46px;flex:1}

/* ---------- business / product ---------- */
.banner{height:150px;background:var(--sk);position:relative}
.banner .contour{position:absolute;inset:0;width:100%;height:100%;opacity:.55;color:var(--g)}
.logo-b{width:76px;height:76px;border-radius:20px;border:4px solid var(--bg);background:var(--sk);margin-top:-38px;flex:none;display:grid;place-items:center;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);margin:14px 16px 0;padding:12px 4px}
.metrics div{text-align:center}
.metrics b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:19px}
.metrics small{color:var(--muted);font-size:12px}
.metrics div+div{border-left:1px solid var(--line)}
.actbar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:14px 16px 0}
.actbar button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600}
.actbar .ab{width:100%;height:46px;border-radius:14px;background:var(--g-soft);color:var(--g-t);display:grid;place-items:center}
.actbar button:nth-child(5) .ab{background:var(--g);color:#fff}
.gallery{height:300px;background:var(--sk);position:relative;display:grid;place-items:center;color:var(--muted)}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6)}
.dots i:first-child{background:#fff;width:20px;border-radius:5px}
.fl{position:absolute;top:12px;display:flex;gap:8px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;padding:16px;align-items:center}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0}
.stickyact{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.pcard{overflow:hidden}
.pcard .pi{aspect-ratio:1/1;background:var(--sk)}
.pcard .pb{padding:10px 12px 12px;display:grid;gap:8px}

/* ---------- forms ---------- */
.up{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.upt{aspect-ratio:1/1;border:2px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;color:var(--muted);font-size:12px;font-weight:600;background:var(--surface)}
.upt:first-child{border-color:var(--g);color:var(--g-t);background:var(--g-soft)}
.fsec{padding:16px}
.fsec>h3{font-size:16px;margin-bottom:12px}
.formbar{position:sticky;bottom:0;padding:12px 16px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}

/* ---------- roles ---------- */
.role{display:flex;align-items:center;gap:14px;padding:16px;width:100%;text-align:left;border-radius:18px;background:var(--surface);border:1.5px solid var(--line)}
.role:hover,.role[aria-pressed="true"]{border-color:var(--g);background:var(--g-soft)}
.role .ri{width:52px;height:52px;border-radius:16px;background:var(--g);color:#fff;display:grid;place-items:center;flex:none}
.role:nth-child(2) .ri{background:var(--b)}
.role:nth-child(3) .ri{background:#C99A00;color:#fff}
.role:nth-child(4) .ri{background:var(--g-d)}
.role b{display:block;font-size:16px;font-family:'Bricolage Grotesque',sans-serif}
.role span{color:var(--muted);font-size:13.5px}

/* ---------- plans, stats, misc ---------- */
.plans{display:grid;gap:12px;padding:0 16px 16px}
@container dev (min-width:700px){.plans{grid-template-columns:repeat(2,1fr)}}
.plan{padding:18px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);display:grid;gap:12px}
.plan h3{font-size:20px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.plan ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plan li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.plan li svg{color:var(--g-t);margin-top:2px}
.plan.silver{border-top:5px solid #9AA7A1}
.plan.gold{border-top:5px solid var(--y)}
.plan.plat{border-top:5px solid var(--b)}
.plan.free{border-top:5px solid var(--sk)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.stat{padding:14px}
.stat small{color:var(--muted);display:flex;align-items:center;gap:6px;font-size:13px}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:30px;margin-top:6px}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:18px 16px 6px;text-align:center}
.stepper div{position:relative;font-size:12.5px;font-weight:600;color:var(--muted)}
.stepper div::before{content:"";display:block;width:30px;height:30px;border-radius:50%;background:var(--sk);margin:0 auto 8px;border:2px solid var(--line);position:relative;z-index:1}
.stepper div::after{content:"";position:absolute;top:14px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:var(--line)}
.stepper div:last-child::after{display:none}
.stepper .cur{color:var(--ink)}
.stepper .cur::before{background:var(--y);border-color:var(--y)}
.docs{display:grid;gap:10px;padding:0 16px}
.doc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.doc .li-i{width:42px;height:42px;border-radius:12px;background:var(--b-soft);color:var(--b);display:grid;place-items:center}
.thread{display:flex;flex-direction:column;justify-content:center;min-height:100%;padding:16px}
.compose{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
.compose .inp{border-radius:99px;min-height:44px}
.bar{height:8px;border-radius:8px;background:var(--sk);overflow:hidden;flex:1}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--sk);border:4px solid var(--surface);display:grid;place-items:center;color:var(--muted);flex:none}
.bignum{font-family:'Bricolage Grotesque',sans-serif;font-size:46px;font-weight:700;line-height:1}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--b-soft);color:var(--b);font-size:13.5px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .note{color:#8DBBE6}}

/* ---------- admin ---------- */
.adm{display:grid;min-height:100%}
.adm-s{display:none;background:var(--rail);color:#DCEBE4;padding:18px 12px}
.adm-s h4{color:#fff;padding:4px 10px 14px;display:flex;gap:10px;align-items:center}
.adm-s button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;font-size:14px;color:#C5DACF;text-align:left}
.adm-s button:hover{background:rgba(255,255,255,.07)}
.adm-s button[aria-current="true"]{background:var(--g);color:#fff}
.adm-m{min-width:0}
.adm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:16px}
.adm-two{display:grid;gap:12px;padding:0 16px 16px}
.adm-mods{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{text-align:left;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.rank{counter-reset:r;list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rank li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px}
@container dev (min-width:760px){
  .adm{grid-template-columns:230px 1fr}
  .adm-s{display:block}
  .adm-mods{display:none}
  .adm-grid{grid-template-columns:repeat(4,1fr)}
  .adm-two{grid-template-columns:1.3fr 1fr}
}
@container dev (min-width:520px){
  .cats{grid-template-columns:repeat(4,1fr)}
  .pgrid{grid-template-columns:repeat(3,1fr)}
}

.ph{display:grid;place-items:center;width:100%;height:100%;background:var(--pb);color:var(--pc)}
.thumb{width:48px;height:48px;border-radius:14px;overflow:hidden;flex:none;display:block}
.pi{position:relative}
.pi .ph,.gallery .ph{position:absolute;inset:0}
.rt{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px}
.rt svg{fill:var(--y);stroke:var(--y)}
.avatar-s{width:38px;height:38px;border-radius:50%;background:var(--g-soft);color:var(--g-t);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.thread{justify-content:flex-start;gap:10px}
.bub{max-width:82%;padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--surface);border:1px solid var(--line)}
.bub small{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.bub.me{margin-left:auto;background:var(--g);color:#fff;border:0;border-radius:16px 16px 4px 16px}
.bub.me small{color:#CFEDE0}
.bars{display:flex;gap:10px;align-items:flex-end;height:120px;margin-top:14px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.bars i{display:block;width:100%;background:var(--g);border-radius:8px 8px 4px 4px;min-height:6px}
.bars span{font-size:11px;color:var(--muted)}
.bar i{display:block;height:100%;background:var(--y);border-radius:8px}
.stepper .done::before{content:"\2713";display:grid;place-items:center;color:#fff;font-size:15px;background:var(--g);border-color:var(--g)}
.table td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.price{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:700}
.price small{font-family:'Figtree',sans-serif;font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.banner{background:linear-gradient(135deg,#0F8A5F,#1F4E79)}
.list li>button{cursor:pointer}
</style>
</head>

${[['Kibuye Motors & Repairs','ID, license, TIN','30 Sep'],['Bugolobi Grill House','ID, license','30 Sep'],['Kasese Grain Traders','ID, TIN, location','29 Sep'],['Mbarara Heights Apartments','ID, license, TIN','29 Sep']].map(r=>`<tr><td><b>${r[0]}</b></td><td class="muted">${r[1]}</td><td class="muted">${r[2]}</td><td><button class="btn sm ghost" data-toast="Review opened">Review</button></td></tr>`).join('')}</tbody></table></div>
<div class="card pad stack"><h4>Search ranking signals</h4><p class="small muted" style="margin:0">The best match appears first. The nearest business does not win automatically.</p><ol class="rank">${['Location relevance','Distance','Rating','Review count','Verification status','Availability','Subscription level','Response rate'].map((r,i)=>`<li><span class="tag ok" style="min-width:24px;justify-content:center">${i+1}</span>${r}</li>`).join('')}</ol></div></div>
</div></div>`};

const ORDER=['splash','usertype','register','home','search','results','nearby','marketplace','business','product','post','request','seller','plans','verify','messages','reviews','favorites','profile','admin'];
const GROUPS=['Onboarding','Discover','Listings and requests','Account and growth','Administration'];
const TABS=[['home','Home','home'],['search','Search','search'],['nearby','Nearby','compass'],['marketplace','Marketplace','store'],['profile','Profile','user']];

/* ===== shell wiring ===== */
const $=s=>document.querySelector(s);
const host=$('#host'),device=$('#device'),tabbar=$('#tabbar'),rail=$('#rail'),scrim=$('#scrim');
$('#railLogo').innerHTML=`<span class="wordmark" style="font-size:24px"><img src="katale-icon.png" alt="Katale" style="width:34px;height:34px;border-radius:9px;">Katale Online Market</span>`;
$('#prevB').innerHTML=ic('back',18)+'Prev';$('#nextB').innerHTML='Next'+ic('chev',18);
$('#menuB').innerHTML=ic('menu',22);$('#mPrev').innerHTML=ic('back',22);$('#mNext').innerHTML=ic('chev',22);
let html='',lastG=-1;
ORDER.forEach((id,i)=>{const s=S[id];if(s.g!==lastG){html+=`<h5>${GROUPS[s.g]}</h5>`;lastG=s.g}html+=`<button data-nav="${id}"><small>${i+1}</small>${s.t}</button>`});
$('#railList').innerHTML=html;
tabbar.innerHTML=TABS.map(t=>`<button data-go="${t[0]}" data-tab="${t[0]}">${ic(t[2],24)}${t[1]}</button>`).join('');

let cur='splash';
function go(id,push=true){
  if(!S[id])id='splash';
  cur=id;const s=S[id];
  host.innerHTML=s.html();host.scrollTop=0;
  device.classList.toggle('wide',!!s.wide);
  tabbar.hidden=!s.nav;
  tabbar.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===s.nav?'true':'false'));
  document.querySelectorAll('#railList button').forEach(b=>b.setAttribute('aria-current',b.dataset.nav===id?'true':'false'));
  $('#mTitle').textContent=`${ORDER.indexOf(id)+1}. ${s.t}`;
  document.title=`${s.t} · Katale Online Market`;
  if(push)history.replaceState(null,'','#'+id);
  closeRail();
}
function step(d){go(ORDER[(ORDER.indexOf(cur)+d+ORDER.length)%ORDER.length])}
function openRail(){rail.classList.add('open');scrim.hidden=false}
function closeRail(){rail.classList.remove('open');scrim.hidden=true}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
const DIST={Central:['Kampala','Wakiso','Mukono','Masaka','Mpigi','Luwero','Buikwe','Kalangala'],Eastern:['Jinja','Mbale','Tororo','Soroti','Iganga','Busia','Kamuli','Kapchorwa'],Northern:['Gulu','Lira','Arua','Kitgum','Adjumani','Moroto','Nebbi','Apac'],Western:['Mbarara','Kasese','Kabale','Kisoro','Kabarole','Hoima','Bushenyi','Ntungamo']};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-nav],[data-toast],[data-gps],[data-publish],[data-pane],[data-chip],[data-r],.seg button,.switch');
  if(!t)return;
  if(t.dataset.toast)toast(t.dataset.toast);
  if(t.dataset.gps){
    if(navigator.geolocation){navigator.geolocation.getCurrentPosition(()=>toast('Location captured'),()=>toast('Allow location access to continue'),{timeout:6000})}else toast('Location is not available on this device');
    return;
  }
  if(t.dataset.publish){toast('Listing published');setTimeout(()=>go('marketplace'),500);return}
  if(t.dataset.pane){
    const w=t.closest('.tabwrap');
    t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b===t));
    w.querySelectorAll('.pane').forEach(p=>p.hidden=p.dataset.p!==t.dataset.pane);
    return;
  }
  if(t.dataset.r){
    t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));
    const k=+t.dataset.r;const rad={1:30,5:68,10:110,25:150,50:190}[k];
    const c=document.querySelector('#nmap #ring circle');if(c)c.setAttribute('r',rad);
    $('#nl').innerHTML=nearList(k);return;
  }
  if(t.dataset.chip!==undefined){const on=t.getAttribute('aria-pressed')==='true';
    if(t.closest('.chips')&&t.textContent.trim()==='All'){t.setAttribute('aria-pressed','true');return}
    t.setAttribute('aria-pressed',!on);return}
  if(t.matches('.seg button')&&!t.dataset.pane){t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
  if(t.matches('.switch')){t.setAttribute('aria-checked',t.getAttribute('aria-checked')!=='true');return}
  if(t.dataset.nav){go(t.dataset.nav);return}
  if(t.dataset.go)go(t.dataset.go);
});
document.addEventListener('change',e=>{
  if(e.target.dataset.role==='region'){
    const d=e.target.closest('[data-loc]').querySelector('[data-role="district"]');
    const list=DIST[e.target.value]||[];
    d.innerHTML='<option value="">'+(list.length?'Select district or city':'Select region first')+'</option>'+list.map(x=>`<option>${x}</option>`).join('');
    d.disabled=!list.length;
  }
});
$('#prevB').onclick=$('#mPrev').onclick=()=>step(-1);
$('#nextB').onclick=$('#mNext').onclick=()=>step(1);
$('#menuB').onclick=openRail;scrim.onclick=closeRail;
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else if(e.key==='Escape')closeRail();
});
go((location.hash||'#splash').slice(1),false);
})();
</script>
</body>
</html>
